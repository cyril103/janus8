name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      JANUS_VERSION: 0.11.1
      JANUS_REVISION: 053bb183818cf6551accf9abeb90448d9d4de5cb
      JANUS_ARCHIVE_SHA256: e004174530dbfb809cd2c36f963af9fc1f17aac1d6ec31d6c112de5c5f24c258
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installer la release Janus vérifiée
        run: |
          archive="janus-${JANUS_VERSION}-Linux-x86_64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/cyril103/janus/releases/download/v${JANUS_VERSION}/${archive}"
          printf '%s  %s\n' "$JANUS_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          mkdir .janus-toolchain
          tar -xzf "$archive" -C .janus-toolchain --strip-components=1
          echo "$GITHUB_WORKSPACE/.janus-toolchain/bin" >> "$GITHUB_PATH"
      - name: Vérifier la provenance du compilateur
        run: |
          janus --version --json > janus-identity.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          identity = json.loads(Path("janus-identity.json").read_text())
          expected = {
              "schema_version": 1,
              "version": os.environ["JANUS_VERSION"],
              "revision": os.environ["JANUS_REVISION"],
              "dirty": False,
              "channel": "package",
              "target": "x86_64-Linux",
          }
          for field, value in expected.items():
              actual = identity.get(field)
              if actual != value:
                  raise SystemExit(
                      f"unexpected Janus identity field {field}: {actual!r} != {value!r}"
                  )
          print(f"Janus release verified: {identity['identity']}")
          PY
      - name: Valider
        run: |
          janus fmt --check
          janus check --all --deny-warnings
          janus test --fail-if-empty
          janus build
          tests/native_syntax.sh
          tests/native_syntax_mutation.sh
          tests/smoke.sh
