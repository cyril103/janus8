name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      JANUS_VERSION: 0.22.0
      JANUS_REVISION: 63b94894e303fde41a369e7d5c5b113bb8c2b4aa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installer les dépendances Janus
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18 llvm-18-dev ninja-build
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
      - name: Construire le compilateur Janus exact
        run: |
          git clone https://github.com/cyril103/janus.git "$RUNNER_TEMP/janus"
          git -C "$RUNNER_TEMP/janus" checkout "$JANUS_REVISION"
          cmake -S "$RUNNER_TEMP/janus" -B "$RUNNER_TEMP/janus/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DJANUS_CLANG_EXECUTABLE=/usr/lib/llvm-18/bin/clang \
            -DJANUS_LLD_EXECUTABLE=/usr/lib/llvm-18/bin/ld.lld \
            -DJANUS_SOURCE_SHA="$JANUS_REVISION"
          cmake --build "$RUNNER_TEMP/janus/build" --target janus --parallel 2
          echo "$RUNNER_TEMP/janus/build" >> "$GITHUB_PATH"
      - name: Vérifier la provenance du compilateur
        run: |
          janus --version --json > janus-identity.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          identity = json.loads(Path("janus-identity.json").read_text())
          expected = {
              "schema_version": 1,
              "version": os.environ["JANUS_VERSION"],
              "revision": os.environ["JANUS_REVISION"],
              "dirty": False,
              "channel": "stable",
              "target": "x86_64-Linux",
          }
          for field, value in expected.items():
              actual = identity.get(field)
              if actual != value:
                  raise SystemExit(
                      f"unexpected Janus identity field {field}: {actual!r} != {value!r}"
                  )
          print(f"Janus source revision verified: {identity['identity']}")
          PY
      - name: Valider
        run: |
          janus fmt --check
          janus check --all --deny-warnings
          janus test --fail-if-empty
          janus build
          tests/native_syntax.sh
          tests/native_syntax_mutation.sh
          tests/smoke.sh
